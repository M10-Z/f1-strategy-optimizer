name: tests-and-package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests main.py _compat.py data_engine.py degradation_model.py dp_solver.py environment.py
      - run: python -m ruff format --check src tests main.py _compat.py data_engine.py degradation_model.py dp_solver.py environment.py
      - run: python -m pytest -q
      - name: Frontend state and navigation regressions
        run: |
          node scripts/test_openf1_frontend.mjs
          node scripts/test_workbench_frontend.mjs
          node scripts/test_workbench_navigation.mjs
      - run: python -m build
      - name: Install wheel outside source tree and smoke test
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as folder:
              subprocess.run([sys.executable, '-m', 'f1_strategy_optimizer', 'demo', '--laps', '12', '--compare', '--output-dir', 'results'], cwd=folder, check=True)
              subprocess.run([sys.executable, '-c', "from importlib.resources import files; root = files('f1_strategy_optimizer').joinpath('workbench_static'); assert all(root.joinpath(name).is_file() for name in ('index.html', 'app.js', 'history.js', 'navigation.js', 'select.js', 'paddock.svg', 'style.css'))"], cwd=folder, check=True)
